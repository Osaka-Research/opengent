<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tunl.ac — live terminals</title>
<style>
  :root {
    --bg: #0b0e11;
    --bg-raised: #12161b;
    --border: #1f252b;
    --text: #e6e8eb;
    --text-dim: #8b95a1;
    --accent: #34d399;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem clamp(16px, 4vw, 2.5rem);
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    font-weight: 700;
    font-size: 1.3rem;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
  }
  .brand .prompt { color: var(--accent); }
  .tagline {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-bottom: 2rem;
    text-align: center;
  }
  .cmd-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    max-width: 92vw;
  }
  .cmd-row code {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.7rem 1rem;
    color: var(--accent);
    font-size: 0.85rem;
    user-select: all;
    overflow-x: auto;
    white-space: nowrap;
  }
  .copy-btn {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    font: inherit;
    font-size: 0.78rem;
    padding: 0.7rem 0.9rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }
  .copy-btn.copied { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>

<div class="brand"><span class="prompt">&gt;_</span> tunl.ac</div>
<div class="tagline">share (or stream an ongoing AI session in) your own terminal</div>

<!--
  Machine-readable, always in the raw HTML: an agent that fetches this
  page can lift the command below and run it — that's the whole point
  of self-serve signup. Full instructions also at https://tunl.ac/llms.txt.
-->
<div class="cmd-row">
  <code id="cmd">curl -sL tunl.ac/i | bash</code>
  <button class="copy-btn" onclick="copyCmd(this,'cmd')">copy</button>
</div>

<script>
  function copyCmd(btn, id) {
    const text = document.getElementById(id).textContent;
    const done = () => {
      const prev = btn.textContent;
      btn.textContent = 'copied';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = prev; btn.classList.remove('copied'); }, 1200);
    };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { /* clipboard unavailable */ }
    document.body.removeChild(ta);
  }
</script>

</body>
</html>
